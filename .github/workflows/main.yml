name: "junit-allure-zephyr"

on: [push]

jobs:
  test-automation:
    name: Run JUnit + Allure + Zephyr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Run Maven Tests
        run: mvn clean test

      # --------------------
      # Upload Allure Results
      # --------------------
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-results
          path: target/allure-results

      # --------------------
      # Prepare JUnit XML for Zephyr
      # --------------------
      - name: Prepare JUnit Report
        if: always()
        run: |
          mkdir -p test-results
          cp target/surefire-reports/*.xml test-results/results.xml

      - name: Upload JUnit Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: junit-artifact
          path: test-results/results.xml

      - name: Download JUnit Artifact
        if: always()
        uses: actions/download-artifact@v3
        with:
          name: junit-artifact
          path: download-artifact

      - name: Get JUnit File Path
        id: file
        if: always()
        run: |
          relative_path="download-artifact/results.xml"
          absolute_path="${{ github.workspace }}/$relative_path"
          echo "JUnit file path: $absolute_path"
          echo "path=$absolute_path" >> $GITHUB_OUTPUT

      # --------------------
      # Upload Results to Zephyr
      # --------------------
      - name: Upload JUnit Results to Zephyr
        if: always()
        run: >
          curl --location --request POST
          '${{ vars.ZEPHYR_BASE_URL }}/automations/executions/junit?autoCreateTestCases=true&projectKey=${{ vars.ZEPHYR_PROJECT_KEY }}'
          --header 'Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}'
          --form 'file=@"${{ steps.file.outputs.path }}"'
